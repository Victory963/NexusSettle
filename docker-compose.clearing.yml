services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lumen
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen-local-only
    ports:
      - "5432:5432"
    volumes:
      - lumen-clearing-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen -d lumen"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  lumen-clearing-postgres:
